<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>IoT Challenge – prowadzący</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script></head><body><div class="wrap" style="max-width:1100px" id="app"></div>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=document.getElementById('app');
let pin=sessionStorage.pin||'',game,Q=[],rows=[],cnt=0,key='';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const segSVG=(m,nd=1,inv=0,lab=0)=>{const r=[[10,4,40,8],[50,10,8,36],[50,54,8,36],[10,88,40,8],[2,54,8,36],[2,10,8,36],[10,46,40,8]];
 return `<div style="display:flex;justify-content:center;gap:16px;grid-column:1/3;margin:8px 0">${Array.from({length:nd},(_,d)=>{const f=i=>(((m>>(d*8+i))&1)^inv)?'var(--acc)':'#64748b44';
 return `<svg viewBox="0 0 72 100" style="width:90px">${r.map((q,i)=>`<rect x="${q[0]}" y="${q[1]}" width="${q[2]}" height="${q[3]}" rx="3" fill="${f(i)}"/>`).join('')}<circle cx="64" cy="92" r="4.5" fill="${f(7)}"/>${lab?['a:30:11','b:54:32','c:54:76','d:30:95','e:6:76','f:6:32','g:30:53','dp:64:84'].map(x=>{const[l,a,b]=x.split(':');return `<text x="${a}" y="${b}" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">${l}</text>`}).join(''):''}</svg>`}).join('')}</div>`};
const chipSVG=(t,p)=>{const H=26+p.length*18;return `<svg viewBox="0 0 300 ${H}" style="width:100%;max-width:340px;display:block;margin:6px auto"><rect x="190" y="4" width="100" height="${H-8}" rx="8" fill="#64748b33" stroke="var(--acc)" stroke-width="2"/><text x="240" y="${H/2+4}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${esc(t)}</text>${p.map((n,i)=>`<line x1="170" y1="${22+i*18}" x2="190" y2="${22+i*18}" stroke="var(--acc)" stroke-width="3"/><text x="166" y="${26+i*18}" text-anchor="end" font-size="10" fill="currentColor">${esc(n)}</text>`).join('')}</svg>`};
let hintOpen=false;
const hintHTML=Q=>{const h=Q.hint;if(!h)return '';return `<details class="card" ${hintOpen?'open':''} ontoggle="hintOpen=this.open;if(this.open)useHint()"><summary>💡 Podpowiedź</summary>${h.chip?chipSVG(h.chip.title,h.chip.pins):''}${h.seg?segSVG(0,1,0,1):''}<p class="mut" style="white-space:pre-wrap;font-size:.9em">${esc(h.t||'')}</p></details>`};
const summaryHTML=(Q,d)=>{let last='';return '<div class="card"><h2>📚 Podsumowanie – wszystko po kolei</h2>'+(d||[]).map(x=>{const q=Q.find(z=>z.id===x.q);if(!q)return '';const hd=q.mission!==last?`<h3 class="acc" style="margin:18px 0 4px">${esc(q.mission)}</h3>`:'';last=q.mission;return hd+`<div class="row" style="display:block"><b style="white-space:pre-wrap">${x.q}. ${esc(q.prompt)}</b><div class="acc" style="white-space:pre-wrap">✔ ${esc(ctext(q,x.c))}</div><div class="mut" style="font-size:.9em">${esc(x.e||'')}</div></div>`}).join('')+'</div>'};
const WC=['#f87171','#60a5fa','#fbbf24','#4ade80','#c084fc','#fb923c','#22d3ee','#f472b6'];
const pl=o=>{o=String(o);let i=o.indexOf(' – ');if(i<0)i=o.indexOf(': ');if(i>=0)return[o.slice(0,i),o.slice(i+(o[i]===':'?2:3))];const m=o.match(/^(.*?) \((.*)\)$/);return m?[m[1],m[2]]:[o,'']};
const wirePin=(o,col,act,click,left)=>{const [a,b]=pl(o);return `<button ${click?`onclick="${click}"`:'disabled'} style="all:unset;box-sizing:border-box;cursor:${click?'pointer':'default'};display:flex;align-items:center;gap:8px;height:60px;padding:6px 10px;border-radius:14px;border:2px ${col?'solid '+col:'dashed #94a3b8'};background:${col?col+'26':'transparent'};${act?'box-shadow:0 0 0 3px var(--acc);':''}${left?'flex-direction:row-reverse;text-align:right;':''}"><span style="width:12px;height:12px;border-radius:50%;flex:none;background:${col||'#94a3b8'}"></span><span style="line-height:1.15;min-width:0"><b style="font-size:14px">${esc(a)}</b>${b?`<br><span style="font-size:11px;opacity:.8">${esc(b)}</span>`:''}</span></button>`};
function wireHTML(Q,wr,wl,live){const n=Q.options.length,R=68,H=n*R;
 const L=Q.options.map((o,i)=>wirePin(o,wr[i]!=null?WC[i%8]:null,live&&wl===i,live?(wr[i]!=null?`unwire(${i})`:`wl=${i};draw()`):0,1)).join('');
 const Rr=Q.extra.map((o,j)=>{const u=wr.indexOf(j);return wirePin(o,u>=0?WC[u%8]:null,0,live&&u<0&&wl!=null?`wire(${j})`:0,0)}).join('');
 const ln=wr.map((j,i)=>j==null?'':`<path d="M0 ${i*R+30} C 28 ${i*R+30} 28 ${j*R+30} 56 ${j*R+30}" fill="none" stroke="${WC[i%8]}" stroke-width="6" stroke-linecap="round"/>`).join('');
 return `<div style="grid-column:1/3;display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);margin:6px 0"><div style="display:grid;gap:8px;align-content:start">${L}</div><svg viewBox="0 0 56 ${H}" width="56" height="${H}">${ln}</svg><div style="display:grid;gap:8px;align-content:start">${Rr}</div></div>`}
const ctext=(Q,c)=>{const d=String(c).split('');
 if(Q.kind==='order')return d.map(x=>Q.options[x-1]).join(' → ');
 if(Q.kind==='seg'){const nd=Q.options.length/8;return Array.from({length:nd},(_,k)=>{const b=(c>>(8*k))&255;return (nd>1?'Rejestr '+(k+1)+': ':'')+Q.options.slice(0,8).filter((_,i)=>b>>i&1).join(' ')+' (0x'+b.toString(16).toUpperCase().padStart(2,'0')+')'}).join('\n')}
 if(Q.kind==='match'||Q.kind==='wire')return d.map((x,i)=>Q.options[i]+' ↔ '+Q.extra[x-1]).join('\n');
 if(Q.kind==='multi')return Q.options.filter((_,i)=>c>>i&1).join(', ')+(Q.extra?.[0]==='led'?' = '+c:'');
 if(Q.kind==='number')return c+' '+(Q.extra?.[0]||'');
 return Q.options[c]??''};
const joinUrl=new URL('index.html',location.href).href;
async function set(state,n){
  const r=await sb.rpc('host_set',{p_pin:pin,p_state:state,p_q:n});
  if(r.error){alert('Błąd: '+r.error.message+(r.error.message.includes('bad pin')?' (zły PIN)':''));sessionStorage.pin=pin='';key='';draw();return}
  await poll();
  if(state==='question'&&game?.q_started_at)skew=Date.now()-new Date(game.q_started_at);
}
async function poll(){
  game=(await sb.from('game').select('*').single()).data;
  rows=(await sb.from('leaderboard').select('*')).data||[];
  if(game?.state==='question')cnt=(await sb.rpc('answer_count',{p_q:game.current_q})).data||0;
  const qk=game.state+game.current_q;if(qk!==lastQ){lastQ=qk;hintOpen=false}
  const k=game.state+game.current_q+rows.length+rows.map(r=>r.hints).join('')+cnt+rows.map(r=>r.score).join();
  if(k!==key){key=k;draw()}
}
function login(){pin=document.getElementById('p').value;sessionStorage.pin=pin;draw()}
function reset(){if(confirm('Usunąć wszystkich graczy i wyniki?'))sb.rpc('host_reset',{p_pin:pin}).then(poll)}
function board(n,h){return rows.slice(0,n).map((r,i)=>`<div class="row"><span>${i+1}. ${esc(r.nick)}</span><b>${r.score}${h&&r.hints!=null?' · 💡'+r.hints:''}</b></div>`).join('')}
let adminOpen=false,clearOn=true,lastQ='',skew=0,autoFired='',autoOn=true;
function tick(){
 if(!game||game.state!=='question'||!game.q_started_at)return;
 const q=Q.find(x=>x.id===game.current_q);if(!q)return;
 const el=(Date.now()-skew-new Date(game.q_started_at))/1000;
 const t=document.getElementById('ht');if(t)t.textContent=Math.max(0,Math.ceil(q.seconds-el));
 if(autoOn&&pin&&el>=q.seconds+2&&autoFired!==game.q_started_at){autoFired=game.q_started_at;set('results',game.current_q)}
}
function useHint(){}
function groups(){const g=[];Q.forEach(q=>{const k=/Warsztat \d\/3/.test(q.mission)?'🎮 Warsztat: kabelki i wyświetlacz':q.mission;const l=g[g.length-1];if(l&&l.name===k)l.qs.push(q.id);else g.push({name:k,qs:[q.id]})});return g}
async function jump(q){if(q==null)return;if(clearOn)await sb.rpc('host_clear_q',{p_pin:pin,p_q:q});await set('question',q)}
function stageBar(){const G=groups(),n=game.current_q,gi=G.findIndex(g=>g.qs.includes(n));
 return `<p class="mut" style="margin:0">${game.state==='lobby'?'Poczekalnia':game.state==='final'?'Koniec gry':`Etap ${gi+1}/${G.length} · ${esc(G[gi]?.name||'')} · pytanie ${n}/${Q.length}`}</p>`}
function adminPanel(){const G=groups(),n=game.current_q,st=game.state,gi=G.findIndex(g=>g.qs.includes(n));
 const nav=(l,f,d)=>`<button style="background:transparent;color:var(--txt);padding:8px 12px" ${d?'disabled':''} onclick="${f}">${l}</button>`;
 const rows=G.map((g,i)=>`<div style="margin:8px 0"><div class="mut" style="font-size:.8em">${i+1}. ${esc(g.name)}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${g.qs.map(q=>`<button style="padding:6px 12px;${q===n&&st!=='lobby'?'':'background:transparent;color:var(--txt)'}" onclick="jump(${q})">${q}</button>`).join('')}</div></div>`).join('');
 return `<details class="card" ${adminOpen?'open':''} ontoggle="adminOpen=this.open"><summary>🧭 Panel admina – skocz do etapu</summary>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">${nav('⏮ Poczekalnia',"set('lobby',0)")}${nav('◀ Poprzedni etap',`jump(${G[gi-1]?.qs[0]})`,gi<1)}${nav('Następny etap ▶',`jump(${G[gi+1]?.qs[0]})`,gi>=G.length-1)}${nav('🏁 Ranking końcowy',`set('final',${Q.length})`)}</div>
 <label class="mut"><input type="checkbox" ${clearOn?'checked':''} onchange="clearOn=this.checked"> Przy skoku wyczyść odpowiedzi i punkty z tego pytania (do testów)</label><br><label class="mut"><input type="checkbox" ${autoOn?'checked':''} onchange="autoOn=this.checked"> Automatyczne sprawdzanie po upływie czasu</label>${rows}</details>`}
function draw(){
  if(!pin){$.innerHTML=`<div class="card"><h1>Panel prowadzącego</h1><input id="p" type="password" placeholder="PIN"> <button onclick="login()">Wejdź</button></div>`;return}
  if(!game)return;
  const st=game.state,n=game.current_q,Qq=Q.find(x=>x.id===n),last=n>=Q.length;
  let main='',btn='';
  if(st==='lobby'){
    main=`<div class="card" style="text-align:center"><h1>🔌 IoT Challenge</h1><div id="qr" style="display:inline-block;background:#fff;padding:12px;border-radius:12px"></div>
    <p class="mut">${esc(joinUrl)}</p><p class="big acc">${rows.length} / 37 graczy</p><p>${rows.map(r=>esc(r.nick)).join(' · ')}</p></div>`;
    btn=`<button onclick="set('question',1)">▶ Start – pytanie 1</button>`}
  else if(st==='question'){
    main=`<div class="card"><div class="mut">${esc(Qq.mission)} · ${n}/${Q.length} · ⏱ <b id="ht"></b> s</div><h1>${esc(Qq.prompt)}</h1>${Qq.extra?.[0]==='svg'?segSVG(Qq.extra[1]):''}${hintHTML(Qq)}
    ${Qq.kind==='wire'?wireHTML(Qq,[],null,0):`<div class="opts">${Qq.options.map((o,i)=>`<button class="o${i}" disabled>${esc(o)}</button>`).join('')}</div>`}
    ${Qq.kind==='match'?'<p class="big">'+esc(Qq.extra.join('  ·  '))+'</p>':''}<p class="big acc">Odpowiedzi: ${cnt} / ${rows.length}</p><div class="bar" style="width:${rows.length?cnt/rows.length*100:0}%"></div></div>`;
    btn=`<button onclick="set('results',${n})">⏹ Pokaż odpowiedź</button>`}
  else if(st==='results'){
    main=`<div class="card"><div class="mut">${esc(Qq.mission)}</div><h2>${esc(Qq.prompt)}</h2><div class="opts" id="o"></div><p id="ex" style="font-size:1.15em;margin-top:16px"></p></div>
    <div class="card"><h2>🏆 Top 10</h2>${board(10)}</div>`;
    btn=last?`<button onclick="set('final',${n})">🏁 Zakończ grę</button>`:`<button onclick="set('question',${n+1})">▶ Pytanie ${n+1}</button>`;
    sb.rpc('get_explanation',{p_q:n}).then(r=>{const e=document.getElementById('ex');if(e)e.textContent=r.data||''});
    sb.rpc('get_correct',{p_q:n}).then(r=>{const o=document.getElementById('o');if(o)o.innerHTML=Qq.kind==='wire'?wireHTML(Qq,String(r.data).split('').map(x=>x-1),null,0):Qq.kind!=='choice'?(Qq.kind==='seg'?segSVG(r.data,Qq.options.length/8,Qq.extra?.[0]==='anode'):'')+'<p class="big acc" style="grid-column:1/3;white-space:pre-wrap">'+esc(ctext(Qq,r.data))+'</p>':Qq.options.map((t,i)=>`<button class="o${i} ${i===r.data?'ok':'dim'}" disabled>${esc(t)}</button>`).join('')})}
  else{main=`<div class="card"><h1>🏁 Ranking końcowy</h1>${board(37,1)}<p class="mut">💡 Podpowiedzi użyte łącznie: ${rows.reduce((a,r)=>a+(r.hints||0),0)}</p></div><div id="sum"></div>`;sb.rpc('final_summary').then(r=>{const e=document.getElementById('sum');if(e)e.innerHTML=summaryHTML(Q,r.data)})}
  $.innerHTML=stageBar()+main+`<div class="card" style="display:flex;gap:10px;justify-content:space-between">${btn}<button style="background:transparent;color:var(--txt)" onclick="reset()">♻ Reset</button></div>`;
  $.innerHTML+=adminPanel();
  const qr=document.getElementById('qr');if(qr)new QRCode(qr,{text:joinUrl,width:240,height:240});
}
(async()=>{Q=(await sb.from('questions').select('*').order('id')).data||[];await poll();draw();setInterval(poll,1500);setInterval(tick,250)})();
</script></body></html>
