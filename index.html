<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>IoT Challenge</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script></head><body><div class="wrap" id="app"></div>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=document.getElementById('app');
let seq=[],ms=[],mp=[],wr=[],wl=0;
let pid=localStorage.pid||null,nick=localStorage.nick||'',game,Q=[],key='',sent={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function init(){
  if(pid){const r=await sb.rpc('player_exists',{p_player:pid});if(r.data===false){pid=null;delete localStorage.pid}}
  Q=(await sb.from('questions').select('*').order('id')).data||[];
  await load();
  sb.channel('g').on('postgres_changes',{event:'*',schema:'public',table:'game'},p=>{game=p.new;render()}).subscribe();
  setInterval(load,3000);setInterval(tick,250);
}
async function load(){const r=await sb.from('game').select('*').single();if(r.data){game=r.data;render()}}
async function join(){
  const n=document.getElementById('n').value.trim();
  const r=await sb.rpc('join_game',{p_nick:n});
  if(r.error){document.getElementById('e').textContent=r.error.message.includes('duplicate')?'Ten pseudonim jest zajęty.':'Pseudonim: 2–20 znaków.';return}
  pid=r.data;nick=n;localStorage.pid=pid;localStorage.nick=n;key='';render();
}
async function answer(i){
  sent[game.current_q]=i;draw();
  await sb.rpc('submit_answer',{p_player:pid,p_q:game.current_q,p_choice:i});
}
const segSVG=m=>{const r=[[10,4,40,8],[50,10,8,36],[50,54,8,36],[10,88,40,8],[2,54,8,36],[2,10,8,36],[10,46,40,8]];
 const f=i=>m>>i&1?'var(--acc)':'#64748b44';
 return `<svg viewBox="0 0 72 100" style="width:110px;display:block;margin:8px auto;grid-column:1/3">${r.map((q,i)=>`<rect x="${q[0]}" y="${q[1]}" width="${q[2]}" height="${q[3]}" rx="3" fill="${f(i)}"/>`).join('')}<circle cx="64" cy="92" r="4.5" fill="${f(7)}"/></svg>`};
const ctext=(Q,c)=>{const d=String(c).split('');
 if(Q.kind==='order')return d.map(x=>Q.options[x-1]).join(' → ');
 if(Q.kind==='seg')return Q.options.filter((_,i)=>c>>i&1).join(' ')+' (bajt 0x'+c.toString(16).toUpperCase()+')';
 if(Q.kind==='match'||Q.kind==='wire')return d.map((x,i)=>Q.options[i]+' ↔ '+Q.extra[x-1]).join(' · ');
 if(Q.kind==='multi')return Q.options.filter((_,i)=>c>>i&1).join(', ');
 if(Q.kind==='number')return c+' '+(Q.extra?.[0]||'');
 return Q.options[c]??''};
const B=(c,t,f,x='')=>`<button class="${c}" style="min-height:56px;padding:12px" ${x} onclick="${f}">${t}</button>`;
function tap(i){if(!seq.includes(i)){seq.push(i);draw()}}
function tog(i){ms=ms.includes(i)?ms.filter(x=>x!==i):[...ms,i];draw()}
function wire(j){if(wl==null||wr.includes(j))return;wr[wl]=j;wl=null;for(let i=0;i<wr.length;i++)if(wr[i]==null){wl=i;break}draw()}
function unwire(i){wr[i]=null;wl=i;draw()}
function pick(i){mp.push(i);draw()}
function num(){const v=parseInt(document.getElementById('nv').value);if(!isNaN(v))answer(v)}
function kindUI(Q,s){if(s!==undefined)return '';const k=Q.kind;
 const clr='<button style="background:transparent;color:var(--txt)" onclick="seq=[];ms=[];mp=[];wr=[];wl=0;draw()">Wyczyść</button>';
 if(k==='order')return `<p class="mut">Stukaj od pierwszego do ostatniego kroku:</p><div class="opts" style="grid-template-columns:1fr">${Q.options.map((o,i)=>{const p=seq.indexOf(i);return B('o'+i%4,(p>=0?'<b>'+(p+1)+'.</b> ':'')+esc(o),'tap('+i+')',p>=0?'disabled':'')}).join('')}</div><p style="display:flex;gap:10px">${clr}<button style="flex:1" ${seq.length<Q.options.length?'disabled':''} onclick="answer(+seq.map(i=>i+1).join(''))">Wyślij</button></p>`;
 if(k==='multi')return `<p class="mut">Zaznacz wszystkie poprawne, potem wyślij:</p><div class="opts" style="grid-template-columns:1fr">${Q.options.map((o,i)=>B('o'+i%4+(ms.includes(i)?' sel':''),(ms.includes(i)?'✔ ':'')+esc(o),'tog('+i+')')).join('')}</div><p><button style="width:100%" ${ms.length?'':'disabled'} onclick="answer(${ms.reduce((a,i)=>a+2**i,0)})">Wyślij</button></p>`;
 if(k==='match'){const c=mp.length,done=c>=Q.options.length;
  return `<div class="card">${Q.options.map((o,i)=>`<div class="row"><span>${esc(o)}</span><b class="acc">${i<c?esc(Q.extra[mp[i]]):i===c?'❓':''}</b></div>`).join('')}</div>`+
  (done?`<p style="display:flex;gap:10px">${clr}<button style="flex:1" onclick="answer(+mp.map(i=>i+1).join(''))">Wyślij</button></p>`:
  `<p class="mut">Pasuje do: <b>${esc(Q.options[c])}</b></p><div class="opts" style="grid-template-columns:1fr">${Q.extra.map((o,i)=>B('o'+i%4,esc(o),'pick('+i+')',mp.includes(i)?'disabled':'')).join('')}</div>`+(c?`<p>${clr}</p>`:''))}
 if(k==='number')return `<p style="display:flex;gap:10px"><input id="nv" type="number" inputmode="numeric" style="flex:1" placeholder="Wynik (${esc(Q.extra?.[0]||'')})"><button onclick="num()">Wyślij</button></p>`;

 if(k==='wire'){const n=Q.options.length;if(wr.length!==n){wr=Array(n).fill(null);wl=0}
  const col=i=>['#f87171','#60a5fa','#fbbf24','#4ade80','#c084fc','#fb923c','#22d3ee','#f472b6'][i%8];
  const bs=(i,u)=>`height:48px;padding:2px 6px;font-size:13px;${u!=null?'background:'+col(u)+';':''}`;
  const L=Q.options.map((o,i)=>`<button style="${bs(i,wr[i]!=null?i:null)}${wl===i?'outline:4px solid var(--txt)':''}" onclick="${wr[i]!=null?'unwire('+i+')':'wl='+i+';draw()'}">${esc(o)}</button>`).join('');
  const R=Q.extra.map((o,j)=>{const u=wr.indexOf(j);return `<button style="${bs(j,u>=0?u:null)}" ${u>=0||wl==null?'disabled':''} onclick="wire(${j})">${esc(o)}</button>`}).join('');
  const ln=wr.map((j,i)=>j==null?'':`<line x1="0" y1="${i*52+24}" x2="60" y2="${j*52+24}" stroke="${col(i)}" stroke-width="5" stroke-linecap="round"/>`).join('');
  return `<p class="mut">Stuknij pin po lewej, potem pin po prawej. Stuknięcie podłączonego pinu cofa kabel.</p><div style="display:grid;grid-template-columns:1fr 60px 1fr"><div style="display:grid;gap:4px;align-content:start">${L}</div><svg viewBox="0 0 60 ${n*52}" width="60" height="${n*52}" preserveAspectRatio="none">${ln}</svg><div style="display:grid;gap:4px;align-content:start">${R}</div></div>
  <p style="display:flex;gap:10px;margin-top:12px">${clr}<button style="flex:1" ${wr.some(x=>x==null)?'disabled':''} onclick="answer(+wr.map(j=>j+1).join(''))">Wyślij</button></p>`}
 if(k==='seg')return segSVG(ms.reduce((a,i)=>a|1<<i,0))+`<div class="opts" style="grid-template-columns:1fr 1fr 1fr 1fr">${Q.options.map((o,i)=>B('o'+i%4+(ms.includes(i)?' sel':''),'Q'+'ABCDEFGH'[i]+' · '+o,'tog('+i+')')).join('')}</div><p style="display:flex;gap:10px">${clr}<button style="flex:1" onclick="answer(${ms.reduce((a,i)=>a+2**i,0)})">Wyślij</button></p>`;
 return ''}
const q=()=>Q.find(x=>x.id===game.current_q);
function render(){
  const k=!pid?'join':game.state+game.current_q;
  if(k===key)return;key=k;seq=[];ms=[];mp=[];wr=[];wl=0;draw();
}
async function draw(){
  if(!game)return;
  if(!pid){$.innerHTML=`<div class="card"><h1>🔌 IoT Challenge</h1><p class="mut">Wpisz pseudonim i dołącz do gry.</p>
  <input id="n" maxlength="20" placeholder="Pseudonim" style="width:100%"><p id="e" class="acc"></p>
  <button style="width:100%" onclick="join()">Dołączam!</button></div>`;return}
  const st=game.state;
  if(st==='lobby'){$.innerHTML=`<div class="card"><h2>Cześć, <span class="acc">${esc(nick)}</span>!</h2><p class="mut">Jesteś w grze. Czekaj na start od prowadzącego…</p></div>`;return}
  const Qq=q();
  if(st==='question'&&Qq){
    const s=sent[Qq.id];
    $.innerHTML=`<div class="card"><div class="mut">${esc(Qq.mission)} · <b id="t"></b> s</div><h2>${esc(Qq.prompt)}</h2></div>
    ${Qq.kind!=='choice'?kindUI(Qq,s):`<div class="opts">${Qq.options.map((o,i)=>`<button class="o${i} ${s!==undefined&&s!==i?'dim':''}" ${s!==undefined?'disabled':''} onclick="answer(${i})">${esc(o)}</button>`).join('')}</div>`}
    ${s!==undefined?'<p class="mut" style="text-align:center">Odpowiedź wysłana. Czekaj na wynik…</p>':''}`;tick();return}
  if(st==='results'&&Qq){
    const [c,m,lb,ex]=await Promise.all([sb.rpc('get_correct',{p_q:Qq.id}),sb.rpc('get_my_result',{p_player:pid,p_q:Qq.id}),sb.from('leaderboard').select('*'),sb.rpc('get_explanation',{p_q:Qq.id})]);
    const my=m.data||{},rows=lb.data||[],rank=rows.findIndex(r=>r.nick===nick)+1,me=rows[rank-1];
    $.innerHTML=`<div class="card" style="text-align:center"><div class="big">${my.points>0?'✅ Dobrze!':(my.choice==null?'⏱ Brak odpowiedzi':'❌ Błąd')}</div>
    <p>Poprawna: <b class="acc">${esc(ctext(Qq,c.data))}</b></p><p class="big acc">+${my.points||0} pkt</p>${Qq.kind==='seg'?segSVG(c.data):''}<p class="mut" style="text-align:left">${esc(ex.data||'')}</p>
    <p>Masz <b>${me?me.score:0}</b> pkt · miejsce <b>${rank||'-'}</b> z ${rows.length}</p></div>`;return}
  if(st==='final'){
    const rows=(await sb.from('leaderboard').select('*')).data||[],rank=rows.findIndex(r=>r.nick===nick)+1;
    $.innerHTML=`<div class="card" style="text-align:center"><h1>🏁 Koniec gry!</h1><p class="big acc">Miejsce ${rank||'-'}</p><p>${rows[rank-1]?.score||0} pkt</p></div>`}
}
function tick(){
  const t=document.getElementById('t');if(!t||!game.q_started_at||!q())return;
  t.textContent=Math.max(0,Math.ceil(q().seconds-(Date.now()-new Date(game.q_started_at))/1000));
}
init();
</script></body></html>
