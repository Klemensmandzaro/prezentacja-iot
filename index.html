<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>IoT Challenge</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script></head><body><div class="wrap" id="app"></div>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=document.getElementById('app');
let sentAt={},seq=[],ms=[],mp=[],wr=[],wl=0;
let pid=localStorage.pid||null,nick=localStorage.nick||'',game,Q=[],key='',sent={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function init(){
  if(pid){const r=await sb.rpc('player_exists',{p_player:pid});if(r.data===false){pid=null;delete localStorage.pid}}
  Q=(await sb.from('questions').select('*').order('id')).data||[];
  await load();
  sb.channel('g').on('postgres_changes',{event:'*',schema:'public',table:'game'},p=>{game=p.new;render()}).subscribe();
  setInterval(load,3000);setInterval(tick,250);
}
async function load(){const r=await sb.from('game').select('*').single();if(r.data){game=r.data;render()}}
async function join(){
  const n=document.getElementById('n').value.trim();
  const r=await sb.rpc('join_game',{p_nick:n});
  if(r.error){document.getElementById('e').textContent=r.error.message.includes('duplicate')?'Ten pseudonim jest zajęty.':'Pseudonim: 2–20 znaków.';return}
  pid=r.data;nick=n;localStorage.pid=pid;localStorage.nick=n;key='';render();
}
async function answer(i){
  sent[game.current_q]=i;draw();
  await sb.rpc('submit_answer',{p_player:pid,p_q:game.current_q,p_choice:i});
}
const segSVG=(m,nd=1,inv=0,lab=0)=>{const r=[[10,4,40,8],[50,10,8,36],[50,54,8,36],[10,88,40,8],[2,54,8,36],[2,10,8,36],[10,46,40,8]];
 return `<div style="display:flex;justify-content:center;gap:16px;grid-column:1/3;margin:8px 0">${Array.from({length:nd},(_,d)=>{const f=i=>(((m>>(d*8+i))&1)^inv)?'var(--acc)':'#64748b44';
 return `<svg viewBox="0 0 72 100" style="width:90px">${r.map((q,i)=>`<rect x="${q[0]}" y="${q[1]}" width="${q[2]}" height="${q[3]}" rx="3" fill="${f(i)}"/>`).join('')}<circle cx="64" cy="92" r="4.5" fill="${f(7)}"/>${lab?['a:30:11','b:54:32','c:54:76','d:30:95','e:6:76','f:6:32','g:30:53','dp:64:84'].map(x=>{const[l,a,b]=x.split(':');return `<text x="${a}" y="${b}" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">${l}</text>`}).join(''):''}</svg>`}).join('')}</div>`};
const chipSVG=(t,p)=>{const H=26+p.length*18;return `<svg viewBox="0 0 300 ${H}" style="width:100%;max-width:340px;display:block;margin:6px auto"><rect x="190" y="4" width="100" height="${H-8}" rx="8" fill="#64748b33" stroke="var(--acc)" stroke-width="2"/><text x="240" y="${H/2+4}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${esc(t)}</text>${p.map((n,i)=>`<line x1="170" y1="${22+i*18}" x2="190" y2="${22+i*18}" stroke="var(--acc)" stroke-width="3"/><text x="166" y="${26+i*18}" text-anchor="end" font-size="10" fill="currentColor">${esc(n)}</text>`).join('')}</svg>`};
let hintOpen=true;
const hintHTML=Q=>{const h=Q.hint;if(!h)return '';return `<details class="card" ${hintOpen?'open':''} ontoggle="hintOpen=this.open"><summary>💡 Podpowiedź</summary>${h.chip?chipSVG(h.chip.title,h.chip.pins):''}${h.seg?segSVG(0,1,0,1):''}<p class="mut" style="white-space:pre-wrap;font-size:.9em">${esc(h.t||'')}</p></details>`};
const summaryHTML=(Q,d)=>{let last='';return '<div class="card"><h2>📚 Podsumowanie – wszystko po kolei</h2>'+(d||[]).map(x=>{const q=Q.find(z=>z.id===x.q);if(!q)return '';const hd=q.mission!==last?`<h3 class="acc" style="margin:18px 0 4px">${esc(q.mission)}</h3>`:'';last=q.mission;return hd+`<div class="row" style="display:block"><b style="white-space:pre-wrap">${x.q}. ${esc(q.prompt)}</b><div class="acc" style="white-space:pre-wrap">✔ ${esc(ctext(q,x.c))}</div><div class="mut" style="font-size:.9em">${esc(x.e||'')}</div></div>`}).join('')+'</div>'};
const WC=['#f87171','#60a5fa','#fbbf24','#4ade80','#c084fc','#fb923c','#22d3ee','#f472b6'];
const pl=o=>{o=String(o);let i=o.indexOf(' – ');if(i<0)i=o.indexOf(': ');if(i>=0)return[o.slice(0,i),o.slice(i+(o[i]===':'?2:3))];const m=o.match(/^(.*?) \((.*)\)$/);return m?[m[1],m[2]]:[o,'']};
const wirePin=(o,col,act,click,left)=>{const [a,b]=pl(o);return `<button ${click?`onclick="${click}"`:'disabled'} style="all:unset;box-sizing:border-box;cursor:${click?'pointer':'default'};display:flex;align-items:center;gap:8px;height:60px;padding:6px 10px;border-radius:14px;border:2px ${col?'solid '+col:'dashed #94a3b8'};background:${col?col+'26':'transparent'};${act?'box-shadow:0 0 0 3px var(--acc);':''}${left?'flex-direction:row-reverse;text-align:right;':''}"><span style="width:12px;height:12px;border-radius:50%;flex:none;background:${col||'#94a3b8'}"></span><span style="line-height:1.15;min-width:0"><b style="font-size:14px">${esc(a)}</b>${b?`<br><span style="font-size:11px;opacity:.8">${esc(b)}</span>`:''}</span></button>`};
function wireHTML(Q,wr,wl,live){const n=Q.options.length,R=68,H=n*R;
 const L=Q.options.map((o,i)=>wirePin(o,wr[i]!=null?WC[i%8]:null,live&&wl===i,live?(wr[i]!=null?`unwire(${i})`:`wl=${i};draw()`):0,1)).join('');
 const Rr=Q.extra.map((o,j)=>{const u=wr.indexOf(j);return wirePin(o,u>=0?WC[u%8]:null,0,live&&u<0&&wl!=null?`wire(${j})`:0,0)}).join('');
 const ln=wr.map((j,i)=>j==null?'':`<path d="M0 ${i*R+30} C 28 ${i*R+30} 28 ${j*R+30} 56 ${j*R+30}" fill="none" stroke="${WC[i%8]}" stroke-width="6" stroke-linecap="round"/>`).join('');
 return `<div style="grid-column:1/3;display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);margin:6px 0"><div style="display:grid;gap:8px;align-content:start">${L}</div><svg viewBox="0 0 56 ${H}" width="56" height="${H}">${ln}</svg><div style="display:grid;gap:8px;align-content:start">${Rr}</div></div>`}
const ctext=(Q,c)=>{const d=String(c).split('');
 if(Q.kind==='order')return d.map(x=>Q.options[x-1]).join(' → ');
 if(Q.kind==='seg'){const nd=Q.options.length/8;return Array.from({length:nd},(_,k)=>{const b=(c>>(8*k))&255;return (nd>1?'Rejestr '+(k+1)+': ':'')+Q.options.slice(0,8).filter((_,i)=>b>>i&1).join(' ')+' (0x'+b.toString(16).toUpperCase().padStart(2,'0')+')'}).join('\n')}
 if(Q.kind==='match'||Q.kind==='wire')return d.map((x,i)=>Q.options[i]+' ↔ '+Q.extra[x-1]).join(' · ');
 if(Q.kind==='multi')return Q.options.filter((_,i)=>c>>i&1).join(', ')+(Q.extra?.[0]==='led'?' = '+c:'');
 if(Q.kind==='number')return c+' '+(Q.extra?.[0]||'');
 return Q.options[c]??''};
const B=(c,t,f,x='')=>`<button class="${c}" style="min-height:56px;padding:12px" ${x} onclick="${f}">${t}</button>`;
function tap(i){if(!seq.includes(i)){seq.push(i);draw()}}
function tog(i){ms=ms.includes(i)?ms.filter(x=>x!==i):[...ms,i];draw()}
function wire(j){if(wl==null||wr.includes(j))return;wr[wl]=j;wl=null;for(let i=0;i<wr.length;i++)if(wr[i]==null){wl=i;break}draw()}
function unwire(i){wr[i]=null;wl=i;draw()}
function pick(i){mp.push(i);draw()}
function num(){const v=parseInt(document.getElementById('nv').value);if(!isNaN(v))answer(v)}
function kindUI(Q,s){if(s!==undefined)return '';const k=Q.kind;
 const clr='<button style="background:transparent;color:var(--txt)" onclick="seq=[];ms=[];mp=[];wr=[];wl=0;draw()">Wyczyść</button>';
 if(k==='order')return `<p class="mut">Stukaj od pierwszego do ostatniego kroku:</p><div class="opts" style="grid-template-columns:1fr">${Q.options.map((o,i)=>{const p=seq.indexOf(i);return B('o'+i%4,(p>=0?'<b>'+(p+1)+'.</b> ':'')+esc(o),'tap('+i+')',p>=0?'disabled':'')}).join('')}</div><p style="display:flex;gap:10px">${clr}<button style="flex:1" ${seq.length<Q.options.length?'disabled':''} onclick="answer(+seq.map(i=>i+1).join(''))">Wyślij</button></p>`;
 if(k==='multi')return `<p class="mut">Zaznacz wszystkie poprawne, potem wyślij:</p><div class="opts" style="grid-template-columns:${Q.extra?.[0]==='led'?'1fr 1fr 1fr 1fr':'1fr'}">${Q.options.map((o,i)=>B('o'+i%4+(ms.includes(i)?' sel':''),(Q.extra?.[0]==='led'?(ms.includes(i)?'💡 ':'⚫ '):(ms.includes(i)?'✔ ':''))+esc(o),'tog('+i+')')).join('')}</div><p><button style="width:100%" ${ms.length?'':'disabled'} onclick="answer(${ms.reduce((a,i)=>a+2**i,0)})">Wyślij</button></p>`;
 if(k==='match'){const c=mp.length,done=c>=Q.options.length;
  return `<div class="card">${Q.options.map((o,i)=>`<div class="row"><span>${esc(o)}</span><b class="acc">${i<c?esc(Q.extra[mp[i]]):i===c?'❓':''}</b></div>`).join('')}</div>`+
  (done?`<p style="display:flex;gap:10px">${clr}<button style="flex:1" onclick="answer(+mp.map(i=>i+1).join(''))">Wyślij</button></p>`:
  `<p class="mut">Pasuje do: <b>${esc(Q.options[c])}</b></p><div class="opts" style="grid-template-columns:1fr">${Q.extra.map((o,i)=>B('o'+i%4,esc(o),'pick('+i+')',mp.includes(i)?'disabled':'')).join('')}</div>`+(c?`<p>${clr}</p>`:''))}
 if(k==='number')return `<p style="display:flex;gap:10px"><input id="nv" type="number" inputmode="numeric" style="flex:1" placeholder="Wynik (${esc(Q.extra?.[0]||'')})"><button onclick="num()">Wyślij</button></p>`;

 if(k==='wire'){const n=Q.options.length;if(wr.length!==n){wr=Array(n).fill(null);wl=0}
  const done=wr.filter(x=>x!=null).length;
  return `<p class="mut" style="margin:4px 0">① Stuknij pin po lewej, ② potem pasujący pin po prawej. Połączono: <b class="acc">${done}/${n}</b>. Stuknięcie podłączonego pinu cofa kabel.</p>${wireHTML(Q,wr,wl,1)}<p style="display:flex;gap:10px;margin-top:12px">${clr}<button style="flex:1" ${wr.some(x=>x==null)?'disabled':''} onclick="answer(+wr.map(j=>j+1).join(''))">Wyślij</button></p>`}
 if(k==='seg'){const nd=Q.options.length/8,inv=Q.extra?.[0]==='anode',pm=ms.reduce((a,i)=>a|1<<i,0);return segSVG(pm,nd,inv)+(inv?'<p class="mut" style="text-align:center">Bit = 1 gasi segment (wspólna anoda).</p>':'')+`<div class="opts" style="grid-template-columns:1fr 1fr 1fr 1fr">${Q.options.map((o,i)=>B('o'+i%4+(ms.includes(i)?' sel':''),(nd>1?'R'+((i>>3)+1)+'·':'')+'Q'+'ABCDEFGH'[i%8]+' · '+o,'tog('+i+')')).join('')}</div><p style="display:flex;gap:10px">${clr}<button style="flex:1" onclick="answer(${ms.reduce((a,i)=>a+2**i,0)})">Wyślij</button></p>`}
 return ''}
const q=()=>Q.find(x=>x.id===game.current_q);
function render(){
  const k=!pid?'join':game.state+game.current_q+game.q_started_at;
  if(k===key)return;key=k;seq=[];ms=[];mp=[];wr=[];wl=0;draw();
}
async function draw(){
  if(!game)return;
  if(!pid){$.innerHTML=`<div class="card"><h1>🔌 IoT Challenge</h1><p class="mut">Wpisz pseudonim i dołącz do gry.</p>
  <input id="n" maxlength="20" placeholder="Pseudonim" style="width:100%"><p id="e" class="acc"></p>
  <button style="width:100%" onclick="join()">Dołączam!</button></div>`;return}
  const st=game.state;
  if(st==='lobby'){$.innerHTML=`<div class="card"><h2>Cześć, <span class="acc">${esc(nick)}</span>!</h2><p class="mut">Jesteś w grze. Czekaj na start od prowadzącego…</p></div>`;return}
  const Qq=q();
  if(st==='question'&&Qq){
    if(sentAt[Qq.id]!==game.q_started_at){delete sent[Qq.id];sentAt[Qq.id]=game.q_started_at}
    const s=sent[Qq.id];
    $.innerHTML=`<div class="card"><div class="mut">${esc(Qq.mission)} · <b id="t"></b> s</div><h2>${esc(Qq.prompt)}</h2></div>${Qq.extra?.[0]==='svg'?segSVG(Qq.extra[1]):''}${hintHTML(Qq)}
    ${Qq.kind!=='choice'?kindUI(Qq,s):`<div class="opts">${Qq.options.map((o,i)=>`<button class="o${i} ${s!==undefined&&s!==i?'dim':''}" ${s!==undefined?'disabled':''} onclick="answer(${i})">${esc(o)}</button>`).join('')}</div>`}
    ${s!==undefined?'<p class="mut" style="text-align:center">Odpowiedź wysłana. Czekaj na wynik…</p>':''}`;tick();return}
  if(st==='results'&&Qq){
    const [c,m,lb,ex]=await Promise.all([sb.rpc('get_correct',{p_q:Qq.id}),sb.rpc('get_my_result',{p_player:pid,p_q:Qq.id}),sb.from('leaderboard').select('*'),sb.rpc('get_explanation',{p_q:Qq.id})]);
    const my=m.data||{},rows=lb.data||[],rank=rows.findIndex(r=>r.nick===nick)+1,me=rows[rank-1];
    $.innerHTML=`<div class="card" style="text-align:center"><div class="big">${my.points>0?'✅ Dobrze!':(my.choice==null?'⏱ Brak odpowiedzi':'❌ Błąd')}</div>
    <p>Poprawna: <b class="acc">${esc(ctext(Qq,c.data))}</b></p><p class="big acc">+${my.points||0} pkt</p>${Qq.kind==='seg'?segSVG(c.data,Qq.options.length/8,Qq.extra?.[0]==='anode'):''}${Qq.kind==='wire'?wireHTML(Qq,String(c.data).split('').map(x=>x-1),null,0):''}<p class="mut" style="text-align:left">${esc(ex.data||'')}</p>
    <p>Masz <b>${me?me.score:0}</b> pkt · miejsce <b>${rank||'-'}</b> z ${rows.length}</p></div>`;return}
  if(st==='final'){
    const rows=(await sb.from('leaderboard').select('*')).data||[],rank=rows.findIndex(r=>r.nick===nick)+1,sm=await sb.rpc('final_summary');
    $.innerHTML=`<div class="card" style="text-align:center"><h1>🏁 Koniec gry!</h1><p class="big acc">Miejsce ${rank||'-'}</p><p>${rows[rank-1]?.score||0} pkt</p></div>`+summaryHTML(Q,sm.data)}
}
function tick(){
  const t=document.getElementById('t');if(!t||!game.q_started_at||!q())return;
  t.textContent=Math.max(0,Math.ceil(q().seconds-(Date.now()-new Date(game.q_started_at))/1000));
}
init();
</script></body></html>
